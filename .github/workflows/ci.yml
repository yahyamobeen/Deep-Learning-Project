name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ml-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt
      - name: Install (lightweight subset for DUMMY-mode tests)
        run: |
          pip install --upgrade pip
          # Don't install torch/whisper for CI; the dummy-mode tests don't
          # need them and that keeps CI under 1 minute.
          pip install fastapi pydantic 'numpy>=1.26' 'scipy>=1.13' fastdtw \
                      python-multipart pytest 'transformers>=4.45'
      - name: Run dummy-mode pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/ml-service
        run: pytest tests/test_dummy_mode.py -q

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
